version: '3.8'

services:
  # Standalone headless test runner inside Docker
  demoqa-test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./target:/app/target
      - ~/.m2:/root/.m2:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BROWSER=chrome
      - HEADLESS=true
      - THREAD_COUNT=2
      - ENVIRONMENT=qa

  # Local Distributed Selenium Grid Hub (Optional)
  selenium-hub:
    image: selenium/hub:4.21.0
    container_name: demoqa-selenium-hub
    ports:
      - "4444:4444"

  # Selenium Chrome Node attached to Hub (Optional)
  chrome-node:
    image: selenium/node-chrome:4.21.0
    container_name: demoqa-chrome-node
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    shm_size: '2gb'
