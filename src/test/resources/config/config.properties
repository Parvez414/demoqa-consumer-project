# ==============================================================================
# DemoQA React SPA Test Automation - Consumer Configuration
# Powered by AI Test Automation Framework Core SDK 1.0.0
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Core Execution & Browser Settings
# ------------------------------------------------------------------------------
# Target Browser: chrome, firefox, edge
browser=chrome

# Run browser in headless mode (true for CI/CD pipelines, false for local debugging)
headless=true

# Execution Mode: "local" OR "remote" (for Docker, Selenium Grid, Cloud Platforms)
execution.mode=local

# Parallel Thread Count for Concurrent Test Execution
thread.count=3

# Target Environment: dev, qa, staging, prod (loads config/{env}.properties)
environment=qa

# Automatic Flakiness Retry Count for network/transient failures
test.retry.count=1

# Pacing delay between browser actions in ms (set to 0 for maximum CI speed)
execution.delay.ms=300

# ------------------------------------------------------------------------------
# 2. Timeouts & Polling
# ------------------------------------------------------------------------------
timeout.explicit=20
timeout.implicit=0
timeout.pageload=60
timeout.retry.count=3
timeout.polling.ms=500

# ------------------------------------------------------------------------------
# 3. Remote Grid & Cloud Platforms (BrowserStack, SauceLabs, LambdaTest, Docker)
# ------------------------------------------------------------------------------
# Default local Docker Selenium Hub URL (used when execution.mode=remote)
grid.url=http://localhost:4444/wd/hub

# Cloud Provider: "browserstack", "saucelabs", "lambdatest", or "custom"
cloud.provider=
cloud.username=
cloud.accesskey=
cloud.project.name=DemoQA React SPA QA
cloud.build.name=Build-1.0.0
cloud.os=Windows
cloud.os.version=11

# ------------------------------------------------------------------------------
# 4. Multi-Provider AI Self-Healing Engine Settings
# ------------------------------------------------------------------------------
# Master switch for AI Self-Healing
ai.healing.enabled=true

# AI Healing Mode / Provider:
# "heuristic"    -> Offline DOM heuristics only (0 cost, 0 latency)
# "gemini"       -> Google Gemini LLM with heuristic fallback
# "openai"       -> OpenAI (gpt-4o, gpt-4o-mini)
# "azure_openai" -> Corporate Azure OpenAI private endpoint & deployment
# "claude"       -> Anthropic Claude (claude-3-5-sonnet, claude-3-5-haiku)
# "ollama"       -> Local / on-premise air-gapped LLM (deepseek-r1, llama3, qwen2.5)
# "hybrid"       -> Fast heuristic first, escalates to active AI provider if needed
# "auto"         -> Auto-detects first configured & responsive AI provider
ai.healing.provider=hybrid

# Optional failover secondary provider if primary LLM fails (e.g., "ollama", "claude")
ai.provider.fallback=

# Dynamic runtime healing for elements that break mid-interaction
ai.runtime.healing.enabled=true

# Minimum confidence threshold (0.50 to 1.00)
ai.healing.confidence.threshold=0.70

# 1. Google Gemini API Settings (or GEMINI_API_KEY environment variable)
ai.gemini.api.key=
ai.gemini.model=gemini-3.6-flash
ai.gemini.temperature=0.1
ai.gemini.timeout.seconds=30

# 2. OpenAI API Settings (or OPENAI_API_KEY environment variable)
ai.openai.api.key=
ai.openai.model=gpt-4o-mini
ai.openai.timeout.seconds=20

# 3. Azure OpenAI API Settings (or AZURE_OPENAI_KEY environment variable)
ai.azure.openai.endpoint=
ai.azure.openai.api.key=
ai.azure.openai.deployment.name=gpt-4o
ai.azure.openai.api.version=2024-02-15-preview

# 4. Anthropic Claude API Settings (or ANTHROPIC_API_KEY environment variable)
ai.claude.api.key=
ai.claude.model=claude-3-5-haiku-20241022
ai.claude.timeout.seconds=20

# 5. Local / Air-Gapped Ollama Settings (100% Offline / Zero Cost)
ai.ollama.base.url=http://localhost:11434
ai.ollama.model=deepseek-r1:8b
ai.ollama.timeout.seconds=30

# ------------------------------------------------------------------------------
# 5. Centralized Web Management Dashboard & Telemetry Hub
# ------------------------------------------------------------------------------
# Stream live test execution and self-healing telemetry to the Centralized Web Portal (Port 8080)
ai.telemetry.enabled=true
ai.telemetry.url=http://localhost:8080/api/telemetry/report
dashboard.telemetry.enabled=true
dashboard.telemetry.url=http://localhost:8080/api/telemetry/report

# ------------------------------------------------------------------------------
# 6. Git Auto-Patch & Self-Healing PR Generator (GitHub, GitLab, Bitbucket, Azure)
# ------------------------------------------------------------------------------
# Automatically patch broken locators in Java Page Object files and create Git branches
ai.autopatch.enabled=false
ai.autopatch.auto.branch=true
ai.autopatch.branch.prefix=ai-heal/patch-
ai.autopatch.git.commit=true
ai.autopatch.create.pr=false
