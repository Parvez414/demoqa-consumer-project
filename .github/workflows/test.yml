name: HealQA Enterprise Test Automation CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated AI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Test Suite in Headless CI Mode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mvn clean test \
            -Dheadless=true \
            -Dexecution.mode=local \
            -Dai.telemetry.url="${{ secrets.PLATFORM_TELEMETRY_URL || 'http://172.20.208.1:8080/api/v1/telemetry/report' }}"

      - name: Archive Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            target/surefire-reports/
            target/cucumber-reports/
            target/screenshots/
          retention-days: 14
